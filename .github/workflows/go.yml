name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Verify Muster inspector compatibility
        run: |
          git clone --depth 1 --branch v0.1.1 https://github.com/azide0x37/muster /tmp/muster
          cd /tmp/muster
          go build -buildvcs=false -mod=readonly -ldflags '-s -w -X github.com/azide0x37/muster/internal/cli.Version=0.1.1' -o /tmp/muster-cli ./cmd/muster
          cd "$GITHUB_WORKSPACE"
          MUSTER_CLI_SOURCE=/tmp/muster-cli MUSTER_CLI_VERSION=0.1.1 sh tests/test_inspector_cli.sh

      - name: Check version output
        run: go run ./cmd -version

      - name: Build Muster package
        run: make package

      - name: Dry-run release build
        run: sh packaging/build-release.sh "v$(cat VERSION)"

      - name: Test standalone release installer
        run: |
          MUSTER_CLI_SOURCE=/tmp/muster-cli MUSTER_CLI_VERSION=0.1.1 GMC_INSTALL_ARCH=amd64 sh tests/test_release_installer.sh
