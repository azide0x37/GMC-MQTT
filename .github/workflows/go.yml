name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Verify Muster inspector compatibility
        run: |
          git clone --depth 1 --branch v0.1.1 https://github.com/azide0x37/muster /tmp/muster
          cd /tmp/muster
          go build -buildvcs=false -mod=readonly -ldflags '-s -w -X github.com/azide0x37/muster/internal/cli.Version=0.1.1' -o /tmp/muster-cli ./cmd/muster
          cd "$GITHUB_WORKSPACE"
          MUSTER_CLI_SOURCE=/tmp/muster-cli MUSTER_CLI_VERSION=0.1.1 sh tests/test_inspector_cli.sh

      - name: Check version output
        run: go run ./cmd -version

      - name: Build Muster package
        run: make package

      - name: Dry-run release build
        run: sh packaging/build-release.sh v0.0.0-ci
